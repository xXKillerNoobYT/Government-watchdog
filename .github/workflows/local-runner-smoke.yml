name: Local Runner Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    name: Verify local Mac runner (backend)
    runs-on: [self-hosted, macOS, ARM64, government-watchdog, gov-backend]
    steps:
      - name: Print runner context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner arch: $RUNNER_ARCH"
          sw_vers || true
          uname -a
      - name: Verify checkout works
        uses: actions/checkout@v4
      - name: Set up venv and install deps
        run: |
          python3 -m venv .ci-venv
          ./.ci-venv/bin/pip install --upgrade pip
          ./.ci-venv/bin/pip install -r requirements.txt
      - name: Run backend tests (pytest)
        run: |
          ./.ci-venv/bin/python -m pytest -q
      - name: Apply migrations + load Alpine source registry (smoke)
        run: |
          ./.ci-venv/bin/python scripts/source_inventory.py --db .ci-smoke.db
          ./.ci-venv/bin/python scripts/source_inventory.py --db .ci-smoke.db  # re-run: idempotent
      - name: Raw reproducibility check (GOV-75 / 1.04)
        run: |
          # Empty store is trivially reproducible (checked=0); exits 0. This
          # smoke proves the verify command runs end-to-end against a migrated DB.
          ./.ci-venv/bin/python scripts/raw_preservation.py verify --db .ci-smoke.db
          rm -f .ci-smoke.db
      - name: First-slice integration smoke — raw preserved / provenance / default-not-publishable (GOV-77 / 1.02+1.03+1.04+1.05)
        run: |
          # End-to-end: migrate -> seed Alpine registry -> ingest a small
          # sanitized fixture -> assert the three slice-1 contract invariants.
          # Exits non-zero (fails the run LOUDLY) if any invariant regresses.
          # Runs in a throwaway sandbox: no real DB / Raw-PDFs / network.
          ./.ci-venv/bin/python scripts/slice1_smoke.py
      - name: Second-slice integration smoke — no-orphan / not-publishable / valid-pointers / speaker-safe (GOV-84 / Contract 1.07 end-to-end)
        run: |
          # End-to-end: migrate -> reuse Slice-1 registry -> load the sanitized
          # 2026-05-08 WWTP-financing fixture -> segment -> statements +
          # evidence_links with exact pointers -> speaker-attribution safety gate.
          # Asserts the four Slice-2 invariants; exits non-zero (fails LOUDLY) on
          # any regression. Throwaway sandbox: no real DB / network.
          ./.ci-venv/bin/python scripts/slice2_smoke.py
      - name: Third-slice AI-gateway smoke — ai-provenance / no-orphan / attribution-safe / run-log / fail-closed (GOV-89 / Lane 2, 1.09+1.11)
        run: |
          # End-to-end Lane 2: migrate -> reuse Slice-1 registry -> load the
          # sanitized fixture -> segment (Lane-1) -> run an OFFLINE deterministic
          # AI extraction (injected proposer, no model call) -> ledger. Asserts the
          # five AI-gateway invariants (produced_by=ai + fail-closed defaults +
          # provenance; no-orphan rejection; uncertain speaker drops the name;
          # gateway run-log; fail-closed downstream + reviewer gate). Exits
          # non-zero (fails LOUDLY) on any regression. Throwaway sandbox: no real
          # DB / AI / network.
          ./.ci-venv/bin/python scripts/slice3_smoke.py
      - name: Slice 3 C Lane-3 verification smoke — labels / never-promotes / no-gating-write / run-log / fail-closed (GOV-90 / Lane 3, 1.09+1.11)
        run: |
          # End-to-end Lane 3: migrate -> reuse Slice-1 registry -> load the
          # sanitized fixture -> segment (Lane-1) -> Lane-2 AI extraction -> run a
          # deterministic Lane-3 verification over those AI rows. Asserts the five
          # Lane-3 invariants (a verification label per AI statement; a mismatch
          # flags but NEVER promotes — every AI row stays
          # machine_extracted_unreviewed + not_publishable; Lane 3 writes no gating
          # field; the Lane-3 run is logged on the ledger as lane=3_verification;
          # fail-closed downstream). Exits non-zero (fails LOUDLY) on any
          # regression. Throwaway sandbox: no real DB / AI / network.
          ./.ci-venv/bin/python scripts/slice3c_smoke.py
      - name: Slice 3 D Lane-4/5 smoke — risk-flags / no-gating-write / reviewer-gate-rejects / failed-run-blocks / never-publishes / run-log (GOV-91 / Lanes 4+5, 1.09+1.11)
        run: |
          # End-to-end Lanes 4+5: migrate -> reuse Slice-1 registry -> load the
          # sanitized fixture -> segment (Lane-1) -> Lane-2 AI extraction -> Lane-4
          # risk screen -> Lane-5 reviewer-gate. Asserts the six Lane-4/5
          # invariants (1.11 risk flags recorded incl. a legal no-go; the risk
          # layer writes no gating field; the Lane-4 run is logged on the ledger
          # as lane=4_risk; promoting an AI row WITHOUT a reviewer decision is
          # rejected; a failed gateway run blocks downstream; a valid human
          # promotion reaches reviewed but NEVER flips publication_state). Exits
          # non-zero (fails LOUDLY) on any regression. Throwaway sandbox: no real
          # DB / AI / network.
          ./.ci-venv/bin/python scripts/slice3d_smoke.py
      - name: Slice 3 E full AI-gateway integration smoke — Lane 2->3->4->5 end-to-end fail-closed; nothing publishable by default (GOV-92 / Lanes 2-5, 1.09+1.11)
        run: |
          # The Slice-3 capstone. End-to-end Lane 2->3->4->5 as ONE continuous
          # pipeline over a single DB: migrate -> reuse Slice-1 registry -> load
          # the sanitized fixture (preserved raw) -> segment (Lane 1) -> Lane-2 AI
          # extraction -> Lane-3 verification -> Lane-4 risk screen -> Lane-5
          # reviewer-gate. Asserts the twelve end-to-end invariants and, above all,
          # the HEADLINE cross-lane guarantee: after the whole pipeline EVERY
          # AI-written row is still publication-blocked — including a row a human
          # reviewer has approved (the owner publication gate never auto-flips). So
          # zero AI rows reach a publishable state without a reviewer + owner
          # decision. Exits non-zero (fails LOUDLY) on any regression. Throwaway
          # sandbox: no real DB / AI / network.
          ./.ci-venv/bin/python scripts/slice3e_smoke.py
      - name: Slice 4 Prereq-0 read-API smoke — eligible-only serve / zero raw paths (transport) / agenda_thread + typed lifecycle / topic_rollup + acyclicity / labels travel / no orphan (GOV-98 / 1.05+1.07 + concept-map additions)
        run: |
          # Reviewer-internal read-API + concept-map registry additions. End-to-end:
          # migrate -> seed registry source + meetings + agenda items -> write one
          # ELIGIBLE reviewed/publishable statement (evidence pointer carrying a
          # vault path + raw deep-link) + non-eligible statements -> register the
          # agenda_thread + members + a typed supersede edge + a topic_rollup chain
          # -> drive read_api.build_response. Asserts: only the reviewed/eligible
          # record is served (default not returned); the serialized body has ZERO
          # raw/absolute paths (transport-level, GOV-34); the new node/edge types
          # are exposed (agenda_thread + chronological members + typed lifecycle;
          # topic_rollup chain + breadcrumb); acyclicity rejects a written cycle
          # before serving; labels travel; no orphan served. Exits non-zero (fails
          # LOUDLY) on any regression. Throwaway sandbox: no real DB / network.
          ./.ci-venv/bin/python scripts/slice4_prereq0_smoke.py
