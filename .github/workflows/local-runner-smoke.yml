name: Local Runner Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    name: Verify local Mac runner (backend)
    runs-on: [self-hosted, macOS, ARM64, government-watchdog, gov-backend]
    steps:
      - name: Print runner context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner arch: $RUNNER_ARCH"
          sw_vers || true
          uname -a
      - name: Verify checkout works
        uses: actions/checkout@v4
      - name: Set up venv and install deps
        run: |
          python3 -m venv .ci-venv
          ./.ci-venv/bin/pip install --upgrade pip
          ./.ci-venv/bin/pip install -r requirements.txt
      - name: Run backend tests (pytest)
        run: |
          ./.ci-venv/bin/python -m pytest -q
      - name: Apply migrations + load Alpine source registry (smoke)
        run: |
          ./.ci-venv/bin/python scripts/source_inventory.py --db .ci-smoke.db
          ./.ci-venv/bin/python scripts/source_inventory.py --db .ci-smoke.db  # re-run: idempotent
      - name: Raw reproducibility check (GOV-75 / 1.04)
        run: |
          # Empty store is trivially reproducible (checked=0); exits 0. This
          # smoke proves the verify command runs end-to-end against a migrated DB.
          ./.ci-venv/bin/python scripts/raw_preservation.py verify --db .ci-smoke.db
          rm -f .ci-smoke.db
      - name: First-slice integration smoke — raw preserved / provenance / default-not-publishable (GOV-77 / 1.02+1.03+1.04+1.05)
        run: |
          # End-to-end: migrate -> seed Alpine registry -> ingest a small
          # sanitized fixture -> assert the three slice-1 contract invariants.
          # Exits non-zero (fails the run LOUDLY) if any invariant regresses.
          # Runs in a throwaway sandbox: no real DB / Raw-PDFs / network.
          ./.ci-venv/bin/python scripts/slice1_smoke.py
      - name: Second-slice integration smoke — no-orphan / not-publishable / valid-pointers / speaker-safe (GOV-84 / Contract 1.07 end-to-end)
        run: |
          # End-to-end: migrate -> reuse Slice-1 registry -> load the sanitized
          # 2026-05-08 WWTP-financing fixture -> segment -> statements +
          # evidence_links with exact pointers -> speaker-attribution safety gate.
          # Asserts the four Slice-2 invariants; exits non-zero (fails LOUDLY) on
          # any regression. Throwaway sandbox: no real DB / network.
          ./.ci-venv/bin/python scripts/slice2_smoke.py
      - name: Third-slice AI-gateway smoke — ai-provenance / no-orphan / attribution-safe / run-log / fail-closed (GOV-89 / Lane 2, 1.09+1.11)
        run: |
          # End-to-end Lane 2: migrate -> reuse Slice-1 registry -> load the
          # sanitized fixture -> segment (Lane-1) -> run an OFFLINE deterministic
          # AI extraction (injected proposer, no model call) -> ledger. Asserts the
          # five AI-gateway invariants (produced_by=ai + fail-closed defaults +
          # provenance; no-orphan rejection; uncertain speaker drops the name;
          # gateway run-log; fail-closed downstream + reviewer gate). Exits
          # non-zero (fails LOUDLY) on any regression. Throwaway sandbox: no real
          # DB / AI / network.
          ./.ci-venv/bin/python scripts/slice3_smoke.py
