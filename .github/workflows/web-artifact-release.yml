# GOV-1526 (Phase 1b of GOV-1523): build + deny-list-gate + publish the pinned
# backend web artifact (Docs/gov1523-artifact-contract-spec.md §1/§2/§3).
#
# The website repo pins a backend ref via its BACKEND_REF file and downloads
# gw-web-artifact-<short_sha>.tar.gz from THIS repo's GitHub Release for that ref
# (1c). A manual default-branch run builds that tarball; publication additionally
# requires attach_release=true and approval in the web-artifact-release
# environment, so a normal PR merge activates no deploy surface (GOV-420 hold).
#
# The registry DB is local/vault-only and never in the repo; the self-hosted
# gov-backend runner is Isaac's Mac where it lives. Point at it via the repo
# variable GW_REGISTRY_DB (falls back to the in-repo Database path if seeded).
#
# Zero AI, zero external network beyond the Release upload. The deny-list scan
# runs inside the builder (build_artifact check=True): ANY hit fails the job and
# no asset is attached — fail closed by absence (§2/§6).

name: Web Artifact Release

on:
  workflow_dispatch:
    inputs:
      attach_release:
        description: "Attach the tarball to a GitHub Release for this ref (deploy-gated; default no)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-artifact-release
  queue: max

jobs:
  build:
    name: build + deny-list gate (py3.12)
    if: >-
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: [self-hosted, macOS, ARM64, government-watchdog, gov-backend]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prove checkout source is clean
        run: |
          if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            echo "checkout contains modified or untracked source; refusing artifact build"
            git status --short
            exit 1
          fi

      - name: Set up venv (python3.12 required)
        run: |
          PY="$(command -v python3.12 || true)"
          if [ -z "$PY" ]; then
            echo "python3.12 not found on runner — suite needs >=3.12 (PEP 701)"; exit 1
          fi
          if [ -e .ci-venv ]; then
            echo "pre-existing ignored .ci-venv survived checkout cleanup; refusing build"
            exit 1
          fi
          "$PY" -m venv .ci-venv
          ./.ci-venv/bin/pip install \
            --quiet \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            -r requirements-release-macos-arm64-py312.lock

      - name: Deny-list + service tests (no real registry needed)
        run: |
          ./.ci-venv/bin/python -m pytest -q -p no:cacheprovider \
            tests/test_gov1526_export_web_artifact.py \
            tests/test_web_artifact_release_workflow.py

      - name: Re-prove source integrity before reading the registry
        run: |
          if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            echo "dependency setup or tests changed checked-out source; refusing registry access"
            git status --short
            exit 1
          fi

      - name: Build artifact from the registry (deny-list gate inside the builder)
        env:
          GW_REGISTRY_DB: ${{ vars.GW_REGISTRY_DB }}
        run: |
          DB="${GW_REGISTRY_DB:-Database/gov_watchdog.db}"
          if [ ! -f "$DB" ]; then
            echo "registry DB not found at '$DB' — set the GW_REGISTRY_DB repo variable"; exit 1
          fi
          GENERATED_AT="$(git show -s --format=%cI "$GITHUB_SHA")"
          # build_artifact runs the §2 deny-list check by default; a hit exits non-zero.
          ./.ci-venv/bin/python scripts/export_web_artifact.py \
            --db "$DB" \
            --out-dir dist \
            --generated-at "$GENERATED_AT"

      - name: Transfer the gated candidate to the isolated publisher
        if: inputs.attach_release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-artifact-${{ github.sha }}
          path: dist/gw-web-artifact-*.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: protected immutable publication
    if: inputs.attach_release
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: web-artifact-release
    permissions:
      contents: write
    steps:
      - name: Check out the exact approved default-branch source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up the declared verification runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download the gated candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-artifact-${{ github.sha }}
          path: dist

      - name: Publish create-once release after live control checks
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PYTHON_BIN: python
          # These are environment-scoped controls. Configure required reviewers,
          # prevent self-review/admin bypass, and allow only the protected main
          # branch before setting them.
          GW_RELEASE_IMMUTABILITY_CONFIRMED: ${{ vars.GW_RELEASE_IMMUTABILITY_CONFIRMED }}
          GW_RELEASE_SETTINGS_TOKEN: ${{ secrets.GW_RELEASE_SETTINGS_TOKEN }}
          GW_RELEASE_TAG_RULESET_ID: ${{ vars.GW_RELEASE_TAG_RULESET_ID }}
          GW_RELEASE_TAG_RULESET_NO_BYPASS_CONFIRMED: ${{ vars.GW_RELEASE_TAG_RULESET_NO_BYPASS_CONFIRMED }}
          GW_RELEASE_TAG_RULESET_UPDATED_AT: ${{ vars.GW_RELEASE_TAG_RULESET_UPDATED_AT }}
        run: bash scripts/publish_web_artifact_release.sh
