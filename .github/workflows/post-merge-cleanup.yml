name: Post-Merge Worktree Cleanup (Dry-Run)

# GOV-215: event-driven trigger for the post-merge cleanup script.
# Fires after every push to the default branch (which is the moment a PR merges
# on GitHub) and runs `scripts/cleanup_merged_worktrees.py` in DRY-RUN mode.
#
# Why dry-run only:
#   The CTO_WORKFLOWS hard stop forbids `--apply` automation without a
#   CEO-approved plan. The cadence-driven Paperclip routine 804d7f7c is the
#   gated lane that performs `--apply` after the AutomationOpsEngineer
#   reviews dry-run output. CI's job is observation, not deletion.
#
# Cross-repo coverage:
#   The script's KNOWN_REPO_ROOTS sweeps both the Backend and Website
#   checkouts in a single invocation, so this workflow covers both repos
#   from either repo's merge event.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: post-merge-cleanup
  cancel-in-progress: false

jobs:
  dry-run:
    name: Dry-run merged-branch / worktree sweep
    runs-on: [self-hosted, macOS, ARM64, government-watchdog, gov-backend]
    steps:
      - name: Checkout (so the script's source code is up-to-date)
        uses: actions/checkout@v4

      - name: Resolve Paperclip API URL
        id: api
        run: |
          # The runner shares this Mac with the Paperclip instance, so the
          # localhost API is reachable. Fall back to the env var if the
          # runner has one configured.
          echo "url=${PAPERCLIP_API_URL:-http://127.0.0.1:3100}" >> "$GITHUB_OUTPUT"

      - name: Run cleanup script (dry-run, JSON)
        id: sweep
        run: |
          set -o pipefail
          mkdir -p Logs
          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          out="Logs/post-merge-cleanup-${ts}.json"
          python3 scripts/cleanup_merged_worktrees.py \
              --api-url "${{ steps.api.outputs.url }}" \
              --json | tee "$out"
          echo "artifact=$out" >> "$GITHUB_OUTPUT"

      - name: Summarise to GitHub step summary
        if: always()
        run: |
          {
            echo "## Post-Merge Cleanup — Dry-Run"
            echo ""
            echo "Trigger: \`${{ github.event_name }}\` on \`${{ github.ref }}\`"
            echo "Mode: dry-run (no removals — \`--apply\` is gated on the Paperclip daily routine 804d7f7c)"
            echo ""
            if [ -f "${{ steps.sweep.outputs.artifact }}" ]; then
              echo "### Candidates"
              python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ.get("ARTIFACT", ""))
          if not p.exists():
              print("(no artifact)"); raise SystemExit(0)
          d = json.loads(p.read_text())
          print(f"- candidates: {d.get('total_candidates', 0)}")
          print(f"- would remove branches: {d.get('would_remove_branches', 0)}")
          print(f"- would remove worktrees: {d.get('would_remove_worktrees', 0)}")
          print(f"- preserved: {d.get('preserved_count', 0)}")
          print(f"- failed: {d.get('failed_count', 0)}")
          PY
            else
              echo "(no JSON artifact produced — see job log)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          ARTIFACT: ${{ steps.sweep.outputs.artifact }}

      - name: Upload dry-run JSON artifact
        if: always() && steps.sweep.outputs.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: post-merge-cleanup-dry-run
          path: ${{ steps.sweep.outputs.artifact }}
          if-no-files-found: warn
          retention-days: 14
