[pytest]
testpaths = tests
addopts = -p no:asyncio
# GOV-1661 (AUTO GO C6): fail-closed on leaked OS resources. Three live_server
# fixtures called shutdown() without server_close(), leaking the listening
# socket for the rest of the session; the leak was visible only as a
# ResourceWarning nobody read, because CI runs bare `pytest -q`. Promoting it to
# an error makes the next leaked socket/file a test failure instead of a line in
# a summary. Scoped to ResourceWarning deliberately — this is a resource-hygiene
# ratchet, not a blanket -W error.
#
# GOV-1692 (AUTO GO C5/C6, 2026-08-01) — correcting the JUSTIFICATION, not the
# policy. This comment used to assert that a blanket `-W error` "would fail on
# third-party deprecations outside this repo's control". Measured: it does not,
# today. The whole suite passes under `-W error` (2269/2269) and under
# `-W error::DeprecationWarning`.
#
# The scoping is therefore a FORWARD-LOOKING guard rather than a response to a
# current failure — and that is still the right design, because a dependency
# release can start emitting a deprecation at any time and CI must not go red
# for something outside this repo's control. Do NOT "simplify" this to a blanket
# -W error on the strength of it passing this week.
#
# BOTH lines are required, and the second is the one that actually bites.
# A leaked socket's ResourceWarning is raised during garbage collection, where
# an exception cannot propagate: pytest's unraisableexception plugin catches it
# and RE-EMITS it as PytestUnraisableExceptionWarning, a different class. With
# only the first line the suite stayed green with the leak reintroduced — a
# check that cannot fail. Verified by removing a server_close() and confirming
# the run goes red only once the second line is present.
filterwarnings =
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
